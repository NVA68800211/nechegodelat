        :root {
            --bg: #fcfbfa;
            --ink: #3a3530;
            --cw: 120px;                 
            --ch: 166px;                 
            --pitch: 190px;              
            --font-brand: 'Soyuz Grotesk', 'Arial Black', Arial, sans-serif;
            --font-text: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-text);
            font-synthesis: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background:
                radial-gradient(120% 80% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 60%),
                var(--bg);
        }

        .scene { position: fixed; inset: 0; overflow: hidden; }

        .rope { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .rope path, .rope circle { fill: none; }
        #ropeShadow { display: none; }
        #ropeBase   { stroke: #b6a28a; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
        #ropeTwist  { stroke: #e8dccb; stroke-width: 1.1; stroke-dasharray: 1.4 3.1; stroke-linecap: butt; }
        #ropeTip    { fill: #a8937b; }

        .rail { position: absolute; inset: 0; pointer-events: none; }

        .hang {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--cw);
            height: calc(var(--ch) + 24px);
            pointer-events: none;
            perspective: 800px;
            will-change: transform;
            filter: none;
        }

        .swing {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform-origin: 50% 0;       
            will-change: transform;
            pointer-events: none;
        }

        .paper {
            --nr: calc(var(--cw) * 0.032);
            --n1: radial-gradient(circle at 0 34%,    #0000 calc(var(--nr) - .5px), #000 var(--nr));
            --n2: radial-gradient(circle at 100% 34%, #0000 calc(var(--nr) - .5px), #000 var(--nr));
            --n3: radial-gradient(circle at 0 68%,    #0000 calc(var(--nr) - .5px), #000 var(--nr));
            --n4: radial-gradient(circle at 100% 68%, #0000 calc(var(--nr) - .5px), #000 var(--nr));
            -webkit-mask-image: var(--n1), var(--n2), var(--n3), var(--n4);
            mask-image: var(--n1), var(--n2), var(--n3), var(--n4);
            -webkit-mask-composite: source-in;
            mask-composite: intersect;
            position: relative;
            border-radius: 4px calc(var(--cw) * 0.09) calc(var(--cw) * 0.09) 4px;
            background:
                linear-gradient(118deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 42%, rgba(60,40,20,.045) 100%),
                var(--tone, #e2ece9);
            color: var(--ink, #7a736d);
            overflow: hidden;
        }
        .hang .paper {
            position: absolute;
            left: 0;
            top: 12px;
            width: 100%;
            height: var(--ch);
            pointer-events: auto;
            cursor: pointer;
        }

        .paper::before, .paper::after {
            content: '';
            position: absolute;
            left: calc(var(--nr) + 7px);
            right: calc(var(--nr) + 7px);
            height: 2px;
            background-image: radial-gradient(circle at 50% 50%, rgba(60,40,20,.28) 1.05px, transparent 1.6px);
            background-size: 7px 2px;
            background-repeat: repeat-x;
            pointer-events: none;
        }
        .paper::before { top: calc(34% - 1px); }
        .paper::after  { top: calc(68% - 1px); }

        .paper .spine {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 13%;
            background: linear-gradient(90deg, rgba(60,40,20,.10), rgba(60,40,20,.025) 65%, rgba(255,255,255,.35));
            border-right: 1px solid rgba(255,255,255,.55);
        }
        .paper .staple {
            position: absolute;
            left: 5.2%;
            width: 3.2%;
            height: 2px;
            background: rgba(90,80,70,.38);
            border-radius: 1px;
        }
        .paper .staple.s1 { top: 14%; }
        .paper .staple.s2 { top: 86%; }

        .paper .zone {
            position: absolute;
            left: 15%; right: 5%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .paper .z1 { top: 0;   height: 34%; }
        .paper .z2 { top: 34%; height: 34%; }
        .paper .z3 { top: 68%; height: 32%; }
        .paper .clover { width: calc(var(--cw) * 0.38); height: calc(var(--cw) * 0.38); fill: var(--ink); opacity: .85; }
        
        /* СТИЛИ ПРАВКА: Изящная надпись «с заботой о вас» внизу обложки */
        .paper .care-text {
            font-size: calc(var(--cw) * 0.052);
            letter-spacing: .02em;
            color: var(--ink);
            opacity: 0.65;
            font-weight: normal;
            font-family: inherit;
        }

        .clip {
            position: absolute;
            left: calc(50% - 10px);
            /* ПРАВКА: Скрепка смещена четко на ось натяжения шнурка, учитывая 12px верхнего паддинга карточки */
            top: -2px; 
            width: 20px;
            height: 40px;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 1px 1px rgba(60,40,20,.35));
        }

        .hang:focus-visible { outline: none; }
        .hang:focus-visible .paper { box-shadow: 0 0 0 3px #dedf8b; }

        .brandmark {
            position: absolute;
            left: 5%; right: 5%;
            bottom: max(5vh, env(safe-area-inset-bottom));
            text-align: center;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 1.4s ease 2.4s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brandmark .thanks-caption {
            max-width: 540px;
            font-size: 13px;
            line-height: 1.4;
            color: #8c8279;
            margin-bottom: 16px;
            letter-spacing: 0.02em;
            font-weight: normal;
        }
        .brandmark b {
            display: block;
            font-family: var(--font-brand);
            font-weight: 900;
            font-size: clamp(26px, 6vw, 44px);
            letter-spacing: .18em;
            color: var(--ink);
            text-indent: .18em;
            text-transform: uppercase;
        }
        .brandmark span {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: #a5b1c2;
        }
        .brandmark i {
            display: block;
            margin-top: 14px;
            font-style: normal;
            font-size: 11px;
            letter-spacing: .1em;
            color: #b9b2aa;
        }
        @keyframes fade-in { to { opacity: 1; } }

        .veil {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(212, 210, 206, 0.88); 
            display: none;
            opacity: 0;
        }
        .veil.on { display: block; }
        [data-mode="full"] .veil { -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
        .stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 50%; overflow: hidden; }

        .book { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); transform-style: preserve-3d; filter: none; }
        .book .paper { position: absolute; inset: 0; }
        .cover { position: absolute; inset: 0; transform-style: preserve-3d; }
        .cface { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(40,30,20,.55), rgba(40,30,20,0)); opacity: 0; pointer-events: none; }
        .v .shade { background: linear-gradient(180deg, rgba(40,30,20,.55), rgba(40,30,20,0)); }

        /* Внутренние страницы: без перфорации и вырезов, только рамка */
        .book .pg, .book .back { -webkit-mask-image: none; mask-image: none; }
        .book .pg::before, .book .pg::after, .book .back::before, .book .back::after { display: none; }
        .inside-deco { position: absolute; inset: 9%; border: 1.5px dashed rgba(60,40,20,.22); border-radius: 8px; pointer-events: none; }

        /* Левая страница: «А вы знали?» */
        .know {
            position: absolute;
            inset: 9%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--cw) * 0.07);
            text-align: center;
            color: var(--ink);
        }
        .know .clover { width: calc(var(--cw) * 0.22); height: calc(var(--cw) * 0.22); }
        .know b {
            font-family: var(--font-brand);
            font-weight: 900;
            font-size: calc(var(--cw) * 0.15);
            line-height: 1.12;
            letter-spacing: .02em;
        }

        /* Правая страница: факт (размер подбирается скриптом под длину текста) */
        .hello {
            position: absolute;
            inset: 9%;
            padding: calc(var(--cw) * 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-text);
            color: #3a3530;
            opacity: 0;
        }
        .fact {
            width: 100%;
            font-size: calc(var(--cw) * 0.075);
            line-height: 1.4;
            text-align: center;
            overflow-wrap: break-word;
            -webkit-hyphens: none;
            hyphens: none;
            text-wrap: balance;
        }

        .closebtn {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            border: 0;
            background: rgba(255,255,255,.7);
            border-radius: 50%;
            font-size: 26px;
            line-height: 44px;
            color: #8c8279;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 2px 10px rgba(70,50,30,.1);
        }
        .closebtn:hover { color: var(--ink); }

        /* ───────── ЛЁГКИЙ РЕЖИМ ───────── */
        [data-mode="lite"] .hang, [data-mode="static"] .hang { filter: none; perspective: none; }
        .lite-track {
            position: absolute;
            left: 0;
            display: flex;
            width: max-content;
            animation: lite-scroll var(--dur, 40s) linear infinite;
            will-change: transform;
        }
        @keyframes lite-scroll { to { transform: translate3d(-50%, 0, 0); } }
        .lite-track .hang, .static-row .hang { position: relative; flex: 0 0 auto; margin-right: calc(var(--pitch) - var(--cw)); }

        /* ───────── СТАТИЧНЫЙ РЕЖИМ ───────── */
        .static-row {
            position: absolute;
            left: 0; right: 0;
            display: flex;
            overflow-x: auto;
            padding: 0 24px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .static-row::-webkit-scrollbar { display: none; }
        [data-mode="static"] .brandmark { animation: none; opacity: 1; }
        [data-mode="static"] .veil { background: rgba(205, 203, 199, 0.98); }
        [data-mode="static"] * { transition: none !important; }

        @media (prefers-reduced-motion: reduce) {
            .brandmark { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f4efe9"/>
                <stop offset=".45" stop-color="#b9b1a8"/>
                <stop offset="1" stop-color="#8f877f"/>
            </linearGradient>
        </defs>
    </svg>
    <div id="probe" style="position:fixed;left:0;top:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden"></div>

    <div class="scene" id="scene">
        <svg class="rope" id="rope" aria-hidden="true">
            <path id="ropeShadow"/>
            <path id="ropeBase"/>
            <path id="ropeTwist"/>
            <circle id="ropeTip" r="3.4" cx="-50" cy="-50"/>
        </svg>
        <div class="rail" id="rail"></div>

        <div class="brandmark" aria-hidden="true">
            <div class="thanks-caption">Спасибо за ожидание! Чтобы быстрее провести время, мы подготовили для вас этот буклет с разными интересными фактами.</div>
            <b>mavka</b>
            <span>perfume &amp; care</span>
            <i>нажмите на буклет</i>
        </div>
    </div>

    <div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="Буклет">
        <button class="closebtn" id="closebtn" aria-label="Закрыть">&times;</button>
        <div class="stage" id="stage"></div>
    </div>

    <script>
    (function () {
        'use strict';

        var net = window.__net || {};
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var canAnimate = typeof Element.prototype.animate === 'function';
        var mode = (net.awful || reduceMotion) ? 'static' : ((net.slow || !canAnimate) ? 'lite' : 'full');
        var root = document.documentElement;
        root.setAttribute('data-mode', mode);

        var rail = document.getElementById('rail');
        var scene = document.getElementById('scene');
        var probe = document.getElementById('probe');
        var ropeBase = document.getElementById('ropeBase');
        var ropeTwist = document.getElementById('ropeTwist');
        var ropeShadow = document.getElementById('ropeShadow');
        var ropeTip = document.getElementById('ropeTip');
        var veil = document.getElementById('veil');
        var stage = document.getElementById('stage');
        var closeBtn = document.getElementById('closebtn');

        var PALETTE = [
            { tone: '#dcebe5', ink: '#6a9283' },   
            { tone: '#f6dedd', ink: '#b5848a' },   
            { tone: '#e6e0f1', ink: '#8d82ab' },   
            { tone: '#f2e9d6', ink: '#a39172' },   
            { tone: '#dbe9f5', ink: '#7391ac' },   
            { tone: '#f9e2d3', ink: '#bd8e72' },   
            { tone: '#f5efcb', ink: '#a79a55' },   
            { tone: '#e3ebd8', ink: '#86976d' }    
        ];

        // Клевер: четыре сердечка остриём к центру (форма с референса), цвет = ink буклета
        var HEART = 'M50 45 C43 39 27 31 27 20 C27 9 42 4 50 15 C58 4 73 9 73 20 C73 31 57 39 50 45 Z';
        var CLOVER = '<svg class="clover" viewBox="0 0 100 100" aria-hidden="true"><g fill="var(--ink)">' +
            '<path d="' + HEART + '"/>' +
            '<path d="' + HEART + '" transform="rotate(90 50 50)"/>' +
            '<path d="' + HEART + '" transform="rotate(180 50 50)"/>' +
            '<path d="' + HEART + '" transform="rotate(270 50 50)"/>' +
            '</g></svg>';

        /* ПРАВКА: Добавлена аккуратная подпись "с заботой о вас" в нижнюю зону обложки буклета */
        var PAPER_HTML = '<div class="spine"></div><i class="staple s1"></i><i class="staple s2"></i>' +
            '<div class="zone z1"></div>' +
            '<div class="zone z2">' + CLOVER + '</div>' +
            '<div class="zone z3"><span class="care-text">с заботой о вас</span></div>';

        var CLIP_SVG = '<svg viewBox="0 0 20 40" width="20" height="40" fill="none" stroke="url(#metal)" ' +
            'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M5.2 29 V8.6 a4.8 4.8 0 0 1 9.6 0 V33 a3.4 3.4 0 0 1 -6.8 0 V13"/></svg>';

        function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
        function rnd(a, b) { return a + Math.random() * (b - a); }
        function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

        var vw, vh, cw, ch, pitch, ropeY0, cruise;

        function measure() {
            vw = window.innerWidth;
            vh = window.innerHeight;
            var base = Math.min(vw, vh * 1.15);              
            cw = clamp(base * 0.28, 96, 176);
            ch = cw * 1.38;
            pitch = cw * 1.6;
            var safeTop = probe.offsetHeight || 0;
            ropeY0 = safeTop + clamp(vh * 0.1, 56, 120);     
            cruise = clamp(vw * 0.055, 38, 90);              
            root.style.setProperty('--cw', cw.toFixed(1) + 'px');
            root.style.setProperty('--ch', ch.toFixed(1) + 'px');
            root.style.setProperty('--pitch', pitch.toFixed(1) + 'px');
        }

        var cards = [];
        var L = 0;                       

        function buildCard(i) {
            var pal = PALETTE[i % PALETTE.length];
            var hang = el('div', 'hang');
            hang.setAttribute('role', 'button');
            hang.setAttribute('aria-label', 'Открыть буклет');
            hang.tabIndex = 0;
            var swing = el('div', 'swing');
            var paper = el('div', 'paper');
            paper.style.setProperty('--tone', pal.tone);
            paper.style.setProperty('--ink', pal.ink);
            paper.innerHTML = PAPER_HTML;
            var clip = el('div', 'clip');
            clip.innerHTML = CLIP_SVG;
            swing.appendChild(paper);
            swing.appendChild(clip);
            hang.appendChild(swing);

            var c = {
                i: i, pal: pal, hang: hang, swing: swing, paper: paper,
                x: 0, th: rnd(-0.22, 0.22), om: rnd(-0.6, 0.6),
                ph1: rnd(0, 6.28), ph2: rnd(0, 6.28),
                w2: 14 * rnd(0.9, 1.1),            
                shown: false, hidden: false
            };
            hang.addEventListener('click', function () { openBooklet(c); });
            hang.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBooklet(c); }
            });
            paper.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') hover++; });
            paper.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hover = Math.max(0, hover - 1); });
            return c;
        }

        var hover = 0;

        function buildAll(initial) {
            rail.innerHTML = '';
            cards = [];
            var n = Math.max(PALETTE.length, Math.ceil((vw + 3 * pitch) / pitch));
            for (var i = 0; i < n; i++) cards.push(buildCard(i));
            L = n * pitch;
            cards.forEach(function (c, i) {
                c.x = initial ? (vw + 0.7 * pitch + i * pitch) : (-1.1 * cw + i * pitch);
            });
            if (mode === 'full') {
                cards.forEach(function (c) {
                    c.hang.style.transform = 'translate3d(-9999px,0,0)';   
                    rail.appendChild(c.hang);
                });
            }
        }

        var tipX = -30, sagNow = 0, T = 0, S0, S1, ROPE_S = 2.8; 
        var xR;

        function ropeYAt(x) {
            var span = xR - tipX;
            var s = span > 1 ? clamp((x - tipX) / span, 0, 1) : 0;
            var prof = 4 * s * (1 - s);
            var tension = smooth((T / ROPE_S - 0.25) / 0.75);
            var ampW = (1.0 + (1 - tension) * 2.2) * prof;
            var wave = lowFx ? 0 : ampW * (Math.sin(x * 0.011 - T * 1.4) + 0.5 * Math.sin(x * 0.023 + T * 0.9));
            return ropeY0 + sagNow * prof + wave;
        }

        function ropeD() {
            var step = Math.max(8, vw / 80), d = '', x = xR, first = true;
            for (; x > tipX; x -= step) { d += (first ? 'M' : 'L') + x.toFixed(1) + ' ' + ropeYAt(x).toFixed(1); first = false; }
            d += 'L' + tipX.toFixed(1) + ' ' + ropeYAt(tipX).toFixed(1);
            return d;
        }

        function setRope(d) {
            ropeBase.setAttribute('d', d);
            ropeTwist.setAttribute('d', d);
            ropeShadow.setAttribute('d', d);
        }

        var raf = 0, last = 0, tStart = 0, speed = 0, openState = null, lowFx = false;
        var fpsSamples = [], pointer = { x: -999, y: -999, t: 0 };

        function frame(now) {
            raf = requestAnimationFrame(frame);
            if (!tStart) { tStart = now; last = now; }
            var dt = Math.min(0.034, (now - last) / 1000);
            var rawDt = now - last;
            last = now;
            T = (now - tStart) / 1000;

            if (!lowFx && T > ROPE_S + 0.4 && fpsSamples.length < 90) {
                fpsSamples.push(rawDt);
                if (fpsSamples.length === 90) {
                    fpsSamples.sort(function (a, b) { return a - b; });
                    if (fpsSamples[45] > 36) { lowFx = true; root.classList.add('lite-fx'); }
                }
            }

            var p = clamp(T / ROPE_S, 0, 1);
            var pe = 1 - Math.pow(1 - p, 3);
            tipX = (vw + 30) - (vw + 60) * pe;
            var tension = smooth((p - 0.25) / 0.75);
            sagNow = lerp(S0, S1, tension);
            if (p >= 1) {
                var tau = T - ROPE_S;
                sagNow = S1 + 7 * Math.exp(-2.6 * tau) * Math.cos(10 * tau);
            }
            setRope(ropeD());
            if (p < 1) { ropeTip.setAttribute('cx', tipX.toFixed(1)); ropeTip.setAttribute('cy', ropeYAt(tipX).toFixed(1)); }
            else if (ropeTip.getAttribute('cx') !== '-50') { ropeTip.setAttribute('cx', '-50'); }

            var tCards = ROPE_S * 0.72;
            var run = T > tCards;
            var boost = run ? 1 + 2.4 * Math.exp(-(T - tCards) / 1.8) : 1;
            var target = (run ? cruise : 0) * boost * (hover > 0 ? 0.12 : 1) * (openState ? 0.3 : 1);
            speed += (target - speed) * (1 - Math.exp(-dt * 3));

            var gust = 0.55 + 0.45 * Math.sin(0.13 * T + 1.3);
            var lean = -clamp(speed / cruise, 0, 3.4) * 0.055;
            var DAMP = 0.95;
            for (var i = 0; i < cards.length; i++) {
                var c = cards[i];
                c.x -= speed * dt;
                if (c.x < -cw * 1.3) c.x += L;

                var wind = gust * 0.85 * (0.6 * Math.sin(0.9 * T + c.x * 0.0045 + c.ph1) + 0.4 * Math.sin(0.37 * T + c.x * 0.002 + c.ph2));
                var a = -c.w2 * Math.sin(c.th - lean) - DAMP * c.om + wind;
                c.om += a * dt;
                c.th = clamp(c.th + c.om * dt, -0.7, 0.7);

                var onScreen = c.x > -cw * 1.2 && c.x < vw + cw * 0.6;
                if (onScreen) {
                    var y = ropeYAt(c.x);
                    var ry = c.th * 0.5 + 0.07 * Math.sin(0.8 * T + c.ph2);    
                    
                    /* ПРАВКА: Идеальный расчет высоты. Скрепка сажается точно на математический уровень нити, ликвидируя левитацию */
                    c.hang.style.transform = 'translate3d(' + (c.x - cw / 2).toFixed(1) + 'px,' + (y - 12).toFixed(1) + 'px,0)';
                    c.swing.style.transform = 'rotate(' + (c.th * 57.2958).toFixed(2) + 'deg) rotateY(' + (ry * 57.2958).toFixed(2) + 'deg)';
                    c.shown = true;
                } else if (c.shown) {
                    c.hang.style.transform = 'translate3d(-9999px,0,0)';
                    c.shown = false;
                }
            }
        }

        scene.addEventListener('pointermove', function (e) {
            if (e.pointerType !== 'mouse' || mode !== 'full') return;
            var now = performance.now(), dt = Math.max(8, now - pointer.t);
            var vx = (e.clientX - pointer.x) / dt * 16;
            pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = now;
            if (Math.abs(vx) > 400) return;
            if (e.clientY < ropeY0 - 10 || e.clientY > ropeY0 + ch + 40) return;
            for (var i = 0; i < cards.length; i++) {
                var c = cards[i], dx = Math.abs(e.clientX - c.x);
                if (dx < cw * 0.8) c.om += clamp(vx * 0.012, -1.6, 1.6) * (1 - dx / (cw * 0.8));
            }
        });

        function bookGeometry() {
            var vertical = vw < vh;     
            var S = vertical ? Math.min(vw * 0.88 / cw, vh * 0.86 / (2 * ch)) : Math.min(vw * 0.9 / (2 * cw), vh * 0.8 / ch);
            return { vertical: vertical, S: Math.min(S, 2.6) };
        }

        /* ───────── ФАКТЫ ─────────
           Добавляйте новые факты в конец списка, каждый в кавычках через запятую.
           Писать можно как раньше («кошачий нос имеет…? Когда кошка…») — слева уже стоит «А вы знали?»,
           поэтому скрипт сам уберёт «?», поставит точку и сделает первую букву заглавной. */
        var FACTS = [
            // TODO: самый первый факт («…более чем 75% женских и 10% мужских ароматов.») в присланном файле обрезан —
            // пришлите его целиком, добавлю сюда.
            "кошачий нос имеет специальный «орган Якобсона» на нёбе? Когда кошка забавно приоткрывает рот, она буквально пробует запах на вкус.",
            "собаки-ищейки могут идти по следу, оставленному человеком более недели назад, и даже определять, в каком направлении двигался объект?",
            "духи нужно хранить в темном и прохладном месте? Прямые солнечные лучи и высокая влажность в ванной комнате быстро разрушают формулу.",
            "существует фобия запахов, которая называется ольфактофобией? Люди с этим расстройством испытывают панические атаки от резких ароматов.",
            "синтетические компоненты в парфюмерии — это не дешевая замена, а высокая наука? Без них невозможно воссоздать ароматы зелени, моря или сирени.",
            "аромат лаванды способен замедлять сердечный ритм и подготавливать нервную систему ко сну? Это доказано клиническими исследованиями.",
            "в древнем Египте духи были частью религиозных ритуалов, а Клеопатра приказывала пропитывать парфюмерными маслами паруса своих кораблей?",
            "наши воспоминания, связанные с запахами, считаются самыми стойкими? Мы можем забыть лицо или голос, но аромат вспомним спустя 20 лет.",
            "запах свежескошенной травы — это на самом деле сигнал бедствия, который растение выделяет, чтобы привлечь хищных насекомых для защиты?",
            "цитрусовые ноты в парфюмерии (лимон, бергамот, мандарин) самые летучие? Они испаряются первыми, создавая яркое стартовое впечатление.",
            "собаки могут по запаху определять уровень сахара в крови человека и даже диагностировать некоторые заболевания на ранних стадиях?",
            "парфюмерная вода (Eau de Parfum) содержит до 20% ароматических масел, в то время как туалетная вода (Eau de Toilette) — всего около 10%?",
            "запах кофе отлично «очищает» обонятельные рецепторы? Если вы выбираете парфюм и перестали различать ноты, вдохните аромат кофейных зерен.",
            "в Англии эпохи Возрождения дамы носили на поясе «помандеры» — ажурные металлические шары с пахучими смолами, чтобы спасаться от городского смрада?",
            "аромат мяты активизирует работу мозга, повышает концентрацию внимания и помогает водителям не засыпать за рулем?",
            "кошки терпеть не могут запах цитрусовых, бананов и кофейной гущи? Эти ароматы кажутся их чувствительному носу слишком едкими.",
            "во время сна обоняние человека полностью отключается? Мы не просыпаемся от запаха дыма или еды, нас могут разбудить только звуки или тактильные ощущения.",
            "парфюмерная индустрия Граса во Франции зародилась из-за необходимости маскировать неприятный запах кожаных перчаток, которые там производили?",
            "аромат корицы стимулирует аппетит и поднимает настроение, вызывая у большинства людей подсознательные ассоциации с домашней выпечкой и уютом?",
            "у каждого человека есть свой неповторимый «ольфакторный паспорт» — уникальный личный запах, который определяется нашей генетикой?",
            "запах кориандра у некоторых людей на генетическом уровне ассоциируется исключительно с мылом из-за специфического восприятия альдегидов?",
            "парфюмеры используют ноты кожи, табака и дегтя, чтобы придать ароматам строгость, глубину и так называемый «дорогой» благородный характер?",
            "аромат сандалового дерева держится на базовых нотах дольше всего и способен сохранять свой шлейф на одежде даже после нескольких стирок?"
        ];

        function prettyFact(t) {
            t = String(t).replace(/\s+/g, ' ').trim();
            t = t.replace(/\?\s+/g, '. ').replace(/\?+$/, '.');
            if (!/[.!…]$/.test(t)) t += '.';
            return t.charAt(0).toUpperCase() + t.slice(1);
        }

        // «Колода»: факты идут в случайном порядке и не повторяются, пока не покажутся все
        var deck = [], lastFact = '';
        function nextFact() {
            if (!deck.length) {
                deck = FACTS.slice();
                for (var i = deck.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1)), x = deck[i]; deck[i] = deck[j]; deck[j] = x;
                }
                if (deck.length > 1 && deck[deck.length - 1] === lastFact) deck.unshift(deck.pop());
            }
            lastFact = deck.pop();
            return prettyFact(lastFact);
        }

        // Подбираем размер текста, чтобы факт любой длины целиком помещался на странице
        function fitFact(b) {
            var box = b.hello, p = b.fact;
            if (!box.clientHeight) return;
            var cs = getComputedStyle(box);
            var availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            var size = cw * 0.088, min = cw * 0.046;
            p.style.fontSize = size.toFixed(2) + 'px';
            while (p.offsetHeight > availH && size > min) {
                size -= cw * 0.003;
                p.style.fontSize = size.toFixed(2) + 'px';
            }
        }
        function fitWhenReady(b) {
            fitFact(b);
            if (document.fonts && document.fonts.status !== 'loaded') {
                document.fonts.ready.then(function () { if (openState && openState.b === b) fitFact(b); });
            }
        }

        function makeBook(card, vertical) {
            var book = el('div', 'book' + (vertical ? ' v' : ''));
            var base = el('div', 'paper pg');
            base.style.cssText = 'position:absolute;inset:0;background:#fffdf9 !important;opacity:1 !important;mix-blend-mode:normal !important;';
            base.style.setProperty('--tone', '#fffdf9');
            base.style.setProperty('--ink', card.pal.ink);
            base.innerHTML = '<div class="inside-deco"></div><div class="hello"><p class="fact"></p></div>';
            base.querySelector('.fact').textContent = nextFact();
            
            var cover = el('div', 'cover');
            cover.style.transformOrigin = vertical ? '50% 0' : '0 50%';
            
            var front = card.paper.cloneNode(true); front.className = 'paper cface front'; front.style.cssText = 'position:absolute;inset:0;'; front.style.setProperty('--tone', card.pal.tone); front.style.setProperty('--ink', card.pal.ink);
            var fs = el('div', 'shade'); front.appendChild(fs);
            
            var back = el('div', 'paper cface back');
            back.style.cssText = 'position:absolute;inset:0;background:' + card.pal.tone + ' !important;opacity:1 !important;';
            back.style.setProperty('--tone', card.pal.tone);
            back.style.setProperty('--ink', card.pal.ink);
            back.style.transform = vertical ? 'rotateX(180deg)' : 'rotateY(180deg)';
            back.innerHTML = '<div class="inside-deco"></div><div class="know">' + CLOVER + '<b>А вы<br>знали?</b></div>';
            var bs = el('div', 'shade'); back.appendChild(bs);
            
            cover.appendChild(front);
            cover.appendChild(back);
            book.appendChild(base);
            book.appendChild(cover);
            return { book: book, cover: cover, hello: base.querySelector('.hello'), fact: base.querySelector('.fact'), shades: [fs, bs] };
        }

        var EASE_OUT = 'cubic-bezier(.2,.75,.2,1)', EASE_IO = 'cubic-bezier(.45,.05,.25,1)';

        function openBooklet(card) {
            if (openState) return;
            if (mode === 'full') openFull(card); else openSimple(card);
        }

        function showVeil() {
            veil.classList.add('on');
            if (mode === 'static') { veil.style.opacity = 1; return Promise.resolve(); }
            return veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, fill: 'forwards' }).finished;
        }

        function openFull(card) {
            var g = bookGeometry(), S = g.S, vertical = g.vertical;
            var pr = card.paper.getBoundingClientRect();
            var cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
            var startDeg = card.th * 57.2958;

            var b = makeBook(card, vertical);
            stage.innerHTML = '';
            stage.appendChild(b.book);
            openState = { card: card, b: b, vertical: vertical, S: S, busy: true };
            card.hang.style.visibility = 'hidden';
            closeBtn.style.opacity = 0;
            showVeil();
            fitWhenReady(b);

            var c0 = 'translate(' + (cx - cw / 2) + 'px,' + (cy - ch / 2) + 'px) rotate(' + startDeg + 'deg) scale(1)';
            var cMid = 'translate(' + (cx - cw / 2 + (vw / 2 - cx) * 0.5) + 'px,' + (cy - ch / 2 + (vh / 2 - cy) * 0.5 - 24) + 'px) rotate(' + (startDeg * 0.3) + 'deg) scale(' + (1 + (S - 1) * 0.4) + ')';
            var cC = 'translate(' + (vw / 2 - cw / 2) + 'px,' + (vh / 2 - ch / 2) + 'px) rotate(0deg) scale(' + S + ')';
            var cO = vertical
                ? 'translate(' + (vw / 2 - cw / 2) + 'px,' + (vh / 2 + ch * S / 2 - ch / 2) + 'px) rotate(0deg) scale(' + S + ')'
                : 'translate(' + (vw / 2 + cw * S / 2 - cw / 2) + 'px,' + (vh / 2 - ch / 2) + 'px) rotate(0deg) scale(' + S + ')';
            openState.poses = { c0: c0, cC: cC, cO: cO };

            b.book.style.transform = cC;
            b.book.animate([{ transform: c0 }, { transform: cMid, offset: .45 }, { transform: cC }],
                { duration: 750, easing: EASE_OUT });

            setTimeout(function () {
                var rot0 = vertical ? 'rotateX(0deg)' : 'rotateY(0deg)';
                var rot1 = vertical ? 'rotateX(180deg)' : 'rotateY(-180deg)';
                b.cover.style.transform = rot1;
                b.cover.animate([{ transform: rot0 }, { transform: rot1 }], { duration: 950, easing: EASE_IO });
                b.shades.forEach(function (s) {
                    s.animate([{ opacity: 0 }, { opacity: .35, offset: .5 }, { opacity: 0 }], { duration: 950, easing: 'ease-in-out' });
                });
                b.book.style.transform = cO;
                b.book.animate([{ transform: cC }, { transform: cO }], { duration: 950, easing: EASE_IO });

                setTimeout(function () {
                    b.hello.style.opacity = 1;
                    b.hello.animate([{ opacity: 0, transform: 'translateY(10px)', filter: 'blur(4px)' },
                                     { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 650, easing: 'ease-out' });
                    closeBtn.style.opacity = 1;
                    openState.busy = false;
                }, 800);
            }, 620);
        }

        function closeFull() {
            var st = openState;
            if (!st || st.busy) return;
            st.busy = true;
            var b = st.b, p = st.poses, vertical = st.vertical;
            closeBtn.style.opacity = 0;
            b.hello.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });

            var rot0 = vertical ? 'rotateX(0deg)' : 'rotateY(0deg)';
            var rot1 = vertical ? 'rotateX(180deg)' : 'rotateY(-180deg)';
            b.cover.style.transform = rot0;
            b.cover.animate([{ transform: rot1 }, { transform: rot0 }], { duration: 800, delay: 120, easing: EASE_IO, fill: 'backwards' });
            b.shades.forEach(function (s) {
                s.animate([{ opacity: 0 }, { opacity: .35, offset: .5 }, { opacity: 0 }], { duration: 800, delay: 120, easing: 'ease-in-out' });
            });
            b.book.style.transform = p.cC;
            b.book.animate([{ transform: p.cO }, { transform: p.cC }], { duration: 800, delay: 120, easing: EASE_IO, fill: 'backwards' });

            setTimeout(function () {
                b.book.animate([{ opacity: 1, transform: p.cC }, { opacity: 0, transform: p.cC.replace(/scale\([^)]*\)/, 'scale(' + (st.S * 0.7) + ')') }],
                    { duration: 380, easing: 'ease-in', fill: 'forwards' });
                veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, fill: 'forwards' });
            }, 960);

            setTimeout(function () {
                finishClose(st);
            }, 1400);
        }

        function finishClose(st) {
            veil.classList.remove('on');
            veil.getAnimations().forEach(function (a) { a.cancel(); });
            stage.innerHTML = '';
            var c = st.card;
            c.hang.style.visibility = '';
            if (mode === 'full') {
                c.om += (Math.random() < 0.5 ? -1 : 1) * 1.6;           
                c.hang.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
            }
            openState = null;
            try { c.hang.focus({ preventScroll: true }); } catch (e) {}
        }

        function openSimple(card) {
            var g = bookGeometry(), S = g.S, vertical = g.vertical;
            var b = makeBook(card, vertical);
            stage.innerHTML = '';
            stage.style.perspective = 'none';
            stage.appendChild(b.book);
            b.cover.style.transform = vertical ? 'rotateX(180deg)' : 'rotateY(-180deg)';
            b.hello.style.opacity = 1;
            var tx = vertical ? (vw / 2 - cw / 2) : (vw / 2 + cw * S / 2 - cw / 2);
            var ty = vertical ? (vh / 2 + ch * S / 2 - ch / 2) : (vh / 2 - ch / 2);
            b.book.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + S + ')';
            openState = { card: card, b: b, simple: true, busy: false };
            closeBtn.style.opacity = 1;
            if (mode === 'static') { veil.classList.add('on'); veil.style.opacity = 1; }
            else { veil.classList.add('on'); veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, fill: 'forwards' }); }
            fitWhenReady(b);
        }

        function closeSimple() {
            var st = openState; if (!st) return;
            veil.classList.remove('on');
            veil.style.opacity = '';
            veil.getAnimations && veil.getAnimations().forEach(function (a) { a.cancel(); });
            stage.innerHTML = '';
            openState = null;
            try { st.card.hang.focus({ preventScroll: true }); } catch (e) {}
        }

        function closeBooklet() {
            if (!openState) return;
            if (openState.simple) closeSimple(); else closeFull();
        }

        veil.addEventListener('click', function (e) { if (e.target === veil || e.target === stage) closeBooklet(); });
        closeBtn.addEventListener('click', closeBooklet);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBooklet(); });

        function buildSimpleRail() {
            rail.innerHTML = '';
            var n = Math.max(PALETTE.length, Math.ceil((vw + 2 * pitch) / pitch));
            var holder;
            if (mode === 'lite') {
                holder = el('div', 'lite-track');
                holder.style.top = ropeY0 + 'px';
                holder.style.setProperty('--dur', ((n * pitch) / cruise).toFixed(1) + 's');
                for (var k = 0; k < 2; k++) for (var i = 0; i < n; i++) holder.appendChild(buildCard(i).hang);
            } else {
                holder = el('div', 'static-row');
                holder.style.top = ropeY0 + 'px';
                holder.style.pointerEvents = 'auto';
                for (var j = 0; j < PALETTE.length; j++) holder.appendChild(buildCard(j).hang);
            }
            rail.appendChild(holder);
            [].forEach.call(rail.querySelectorAll('.hang'), function (h) { h.style.pointerEvents = 'auto'; });
            var d = 'M-20 ' + ropeY0 + ' Q' + (vw / 2) + ' ' + (ropeY0 + 12) + ' ' + (vw + 20) + ' ' + ropeY0;
            setRope(d);
        }

        function setup(initial) {
            measure();
            S0 = clamp(vh * 0.09, 45, 85);       
            S1 = clamp(vh * 0.024, 14, 28);        
            xR = vw + 30;
            if (mode === 'full') {
                buildAll(initial);
                if (!initial) { T = ROPE_S + 2; tipX = -30; sagNow = S1; }
            } else {
                buildSimpleRail();
            }
        }

        var resizeTimer = null, lastW = 0, lastH = 0;
        function onResize() {
            if (window.innerWidth === lastW && Math.abs(window.innerHeight - lastH) < 90) return;   
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                if (openState) { 
                    if (openState.simple) closeSimple();
                    else { openState.card.hang.style.visibility = ''; veil.classList.remove('on'); veil.getAnimations().forEach(function (a) { a.cancel(); }); stage.innerHTML = ''; openState = null; }
                }
                lastW = window.innerWidth; lastH = window.innerHeight;
                setup(false);
                if (mode === 'full') { tStart = performance.now() - (ROPE_S + 2) * 1000; }
            }, 120);
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);

        lastW = window.innerWidth; lastH = window.innerHeight;
        setup(true);
        if (mode === 'full') {
            raf = requestAnimationFrame(frame);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
                else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
            });
        }
    })();
    </script>
</body>
